<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facial Emotion Recognition</title>
    <link rel="stylesheet" href="C:\Users\bejja\OneDrive\Desktop\face-emotion-recognition\face-emotion-recognition\static\styles.css">
</head>
<body>
    <h1>Facial Emotion Recognition</h1>
    <video autoplay="true" id="videoElement"></video>
    <button id="captureButton" onclick="captureImage()">Capture Image</button>
    <button id="newCaptureButton" onclick="startVideo()" style="display: none;">Capture New Photo</button>
    <br><br>
    <input type="file" accept="image/*" id="uploadImage" onchange="uploadImageFromGallery(event)">
    <br><br>
    <img id="displayImage" src="" alt="Captured Image">
    <p id="emotion">Emotion: <span id="emotionText"></span></p>
    
    <script>
        var video = document.querySelector("#videoElement");
        var captureButton = document.getElementById("captureButton");
        var newCaptureButton = document.getElementById("newCaptureButton");

        function startVideo() {
            if (navigator.mediaDevices.getUserMedia) {
                navigator.mediaDevices.getUserMedia({ video: true })
                    .then(function (stream) {
                        video.srcObject = stream;
                        captureButton.style.display = "block";
                        newCaptureButton.style.display = "none";
                        document.getElementById("displayImage").src = "";
                        document.getElementById("emotionText").innerText = "";
                    })
                    .catch(function (err0r) {
                        console.log("Something went wrong!");
                    });
            }
        }

        function captureImage() {
            var canvas = document.createElement("canvas");
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            var context = canvas.getContext("2d");
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            var imageData = canvas.toDataURL("image/png");
            document.getElementById("displayImage").src = imageData;
            sendImageToServer(imageData);
            video.srcObject.getTracks().forEach(track => track.stop());
            captureButton.style.display = "none";
            newCaptureButton.style.display = "block";
        }

        function uploadImageFromGallery(event) {
            var file = event.target.files[0];
            var reader = new FileReader();
            reader.onload = function (e) {
                var imageData = e.target.result;
                document.getElementById("displayImage").src = imageData;
                sendImageToServer(imageData);
            };
            reader.readAsDataURL(file);
        }

        function sendImageToServer(imageData) {
            fetch('/predict', {
                method: 'POST',
                body: JSON.stringify({ image: imageData }),
                headers: { 'Content-Type': 'application/json' }
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById("emotionText").innerText = data.emotion;
            })
            .catch(error => {
                console.error("Error:", error);
            });
        }

        // Initialize the video stream on page load
        startVideo();
    </script>
</body>
</html>
